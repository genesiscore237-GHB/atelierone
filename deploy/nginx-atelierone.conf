# Nginx reverse proxy — AtelierOne
# Copier dans /etc/nginx/sites-available/atelierone puis :
# sudo ln -s /etc/nginx/sites-available/atelierone /etc/nginx/sites-enabled/
# sudo certbot --nginx -d votre-domaine

server {
    listen 80;
    server_name votre-domaine.local;

    # Redirection HTTPS (si certificat installé)
    # return 301 https://$host$request_uri;

    client_max_body_size 12M;

    # Uploads statiques (photos véhicules, documents)
    location /uploads/ {
        alias /var/lib/atelierone/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Application Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
}

