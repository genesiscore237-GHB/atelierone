name: CI — AtelierOne
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Unitaires · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -F @atelierone/nextjs lint
        continue-on-error: true

      - name: Typecheck (packages)
        run: |
          pnpm -F @atelierone/auth typecheck || true
          pnpm -F @atelierone/db typecheck || true

      - name: Tests unitaires
        run: |
          pnpm -F @atelierone/nextjs exec vitest run || true
          pnpm -F @atelierone/auth exec vitest run || true

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci